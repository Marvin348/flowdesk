services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile

    container_name: flowdesk-api-container

    env_file:
      - server/.env

    ports:
      - "3001:3001"

    command: npm run dev

    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /app/server/node_modules
