services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile

    container_name: flowdesk-api-container

    environment:
      MONGOMS_VERSION: "7.0.14"
      MONGOMS_DISTRO: "ubuntu-22.04"

    env_file:
      - server/.env

    ports:
      - "3001:3001"

    command: npm run dev

    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /app/server/node_modules

  client:
    build:
      context: .
      dockerfile: client/Dockerfile

    container_name: flowdesk-client-container

    ports:
      - "5173:5173"

    command: npm run dev -- --host 0.0.0.0

    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      - /app/client/node_modules
